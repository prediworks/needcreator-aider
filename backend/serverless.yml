service: ugc-platform-api

provider:
  name: scaleway
  runtime: node18
  region: fr-par
  env:
    NODE_ENV: production

functions:
  api:
    handler: src/index.handler
    memorySize: 1024
    timeout: 30
    events:
      - http:
          path: /{proxy+}
          method: ANY
    environment:
      # Variables d'environnement (à configurer via Scaleway Console)
      MONGODB_URI: ${env:MONGODB_URI}
      FIREBASE_PROJECT_ID: ${env:FIREBASE_PROJECT_ID}
      STRIPE_SECRET_KEY: ${env:STRIPE_SECRET_KEY}
      SENDGRID_API_KEY: ${env:SENDGRID_API_KEY}
