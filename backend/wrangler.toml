name = "ugc-platform-api"
main = "src/index.js"
compatibility_date = "2024-01-01"
node_compat = true

# PREPROD Environment
[env.preprod]
name = "ugc-platform-api-preprod"
vars = { NODE_ENV = "preprod" }

# PRODUCTION Environment
[env.production]
name = "ugc-platform-api-prod"
vars = { NODE_ENV = "production" }

# Note: Les secrets doivent être configurés via CLI pour chaque environnement
# Voir le guide de déploiement dans docs/CLOUDFLARE_SETUP.md
